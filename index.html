<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/wanees-app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ونيس">
  <meta name="theme-color" content="#F7F5FB">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ونيس</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script>
    // Cloudflare Turnstile lives outside the Flutter canvas: it floats above
    // it only when a challenge is actually required (interaction-only), so
    // the signup screen keeps its layout and real people never see it.
    window.wanees = window.wanees || {};
    window.wanees.captchaToken = function (siteKey) {
      return new Promise(function (resolve) {
        var waited = 0;
        (function ready() {
          if (window.turnstile) return run();
          if ((waited += 100) > 8000) return resolve(null);
          setTimeout(ready, 100);
        })();

        function run() {
          var host = document.getElementById('wanees-turnstile');
          if (!host) {
            host = document.createElement('div');
            host.id = 'wanees-turnstile';
            host.style.cssText =
              'position:fixed;left:50%;transform:translateX(-50%);' +
              'bottom:24px;z-index:9999;';
            document.body.appendChild(host);
          }
          host.innerHTML = '';
          var done = false;
          var widgetId = null;
          // Tear the widget down once we have an answer, otherwise its
          // "Success!" badge keeps sitting on top of the app.
          var finish = function (t) {
            if (done) return;
            done = true;
            try { if (widgetId !== null) window.turnstile.remove(widgetId); } catch (e) {}
            try { host.remove(); } catch (e) {}
            resolve(t);
          };
          try {
            widgetId = window.turnstile.render(host, {
              sitekey: siteKey,
              appearance: 'interaction-only',
              callback: finish,
              'error-callback': function () { finish(null); },
              'timeout-callback': function () { finish(null); },
            });
          } catch (e) { finish(null); }
          setTimeout(function () { finish(null); }, 60000);
        }
      });
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
